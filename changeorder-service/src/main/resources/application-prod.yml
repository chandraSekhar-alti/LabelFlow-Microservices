server:
  port: ${SERVER_PORT:${PORT:5000}}

spring:
  datasource:
    url: ${CHANGEORDER_DB_URL}
    username: ${CHANGEORDER_DB_USERNAME}
    password: ${CHANGEORDER_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}