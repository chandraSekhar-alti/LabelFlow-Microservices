server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/labelflow_dev
    username: labelflow_user
    password: Test@123

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

security:
  jwt:
    secret: TnU2d0dRV2xYQ2FMaVlWa0QxUXR5N2tUZXJjRk1sRm5nRjBqZlV5Yz0=

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG