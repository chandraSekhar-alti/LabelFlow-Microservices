server:
  port: ${SERVER_PORT:${PORT:5000}}

spring:
  datasource:
    url: ${LABELCHANGE_DB_URL}
    username: ${LABELCHANGE_DB_USERNAME}
    password: ${LABELCHANGE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

logging:
  level:
    org.springframework: INFO